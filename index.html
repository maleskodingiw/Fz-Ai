<title>Fz AI — Assistant Pintar</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg: #000;
    --fg: #ededed;
    --muted: #8f8f8f;
    --muted-2: #6f6f6f;
    --border: rgba(255,255,255,0.1);
    --border-hover: rgba(255,255,255,0.2);
    --accent: #fff;
    --accent-dim: rgba(255,255,255,0.2);
    --radius: 12px;
}

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
}

::selection { background: var(--accent-dim); color: #fff; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* ─── BACKGROUND ──────────────────────────────────────────── */
.bg-logo-pattern {
    position: fixed;
    inset: 0;
    z-index: -10;
    pointer-events: none;
    opacity: 0.04;
    overflow: hidden;
}
.bg-logo-pattern::before {
    content: "Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz Fz";
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 900;
    font-size: 60px;
    color: rgba(255,255,255,0.04);
    letter-spacing: 30px;
    line-height: 1.4;
    width: 200%;
    top: -10%;
    left: -50%;
    transform: rotate(-12deg);
    white-space: nowrap;
    animation: scrollBg 40s linear infinite;
}
@keyframes scrollBg {
    0% { transform: rotate(-12deg) translateX(0); }
    100% { transform: rotate(-12deg) translateX(-50%); }
}

.grid-bg {
    position: fixed;
    inset: 0;
    z-index: -9;
    pointer-events: none;
    background-image:
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(to bottom, black, transparent 80%);
}

/* ─── HEADER ───────────────────────────────────────────────── */
.brand-header {
    flex-shrink: 0;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    z-index: 10;
}

.brand-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    overflow: hidden;
    border: 1px solid var(--border-hover);
    background: #111;
}
.brand-mark img { width: 100%; height: 100%; object-fit: cover; }

.brand-mark-fallback {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: #111;
    border: 1px solid var(--border-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    color: #fff;
}

.brand-text { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.brand-sub {
    font-size: 10px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: .1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 5px;
}

.dot-live {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s ease-in-out infinite;
    display: inline-block;
}
@keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(.8); }
}

.header-actions {
    display: flex;
    gap: 6px;
}

.btn-clear {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: border-color .2s, background .2s, color .2s;
}
.btn-clear:hover {
    border-color: var(--border-hover);
    background: rgba(255,255,255,0.08);
    color: var(--fg);
}

/* ─── CHAT AREA ────────────────────────────────────────────── */
.chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
}

/* ─── EMPTY STATE ──────────────────────────────────────────── */
.empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}
.empty-state .icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
.empty-state h2 { font-size: 20px; font-weight: 600; color: #fff; }
.empty-state p { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
.empty-state .powered { font-size: 11px; color: var(--muted-2); margin-top: 8px; font-family: 'JetBrains Mono', monospace; }

/* ─── CHAT MESSAGE ─────────────────────────────────────────── */
.chat-msg {
    display: flex;
    gap: 10px;
    max-width: 92%;
    animation: rise 0.25s cubic-bezier(0.2,0.8,0.2,1);
}
@keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }

.chat-avatar {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    border: 1px solid var(--border-hover);
    overflow: hidden;
}
.chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
.chat-avatar.ai { background: var(--fg); color: #000; }
.chat-avatar.user { background: rgba(255,255,255,0.05); border-color: var(--border); color: var(--muted); }

.chat-bubble-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 100%;
}

.chat-bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
    max-width: 100%;
}
.chat-msg.ai .chat-bubble {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
}
.chat-msg.user .chat-bubble {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-hover);
    border-top-right-radius: 4px;
}
.chat-bubble.error {
    border-color: rgba(255,255,255,0.25) !important;
    background: rgba(255,255,255,0.05) !important;
    color: #f2a3a3;
}

/* ─── COPY BUTTON ──────────────────────────────────────────── */
.copy-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--muted-2);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.2s;
    align-self: flex-start;
    opacity: 0.5;
}
.copy-btn:hover {
    opacity: 1;
    border-color: var(--border-hover);
    background: rgba(255,255,255,0.08);
    color: var(--fg);
}
.copy-btn.copied {
    color: #4ade80;
    border-color: #4ade80;
    opacity: 1;
}
.chat-msg.user .copy-btn { align-self: flex-end; }

/* ─── CODE BLOCK ───────────────────────────────────────────── */
.code-block {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 6px 0;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: #e2e8f0;
    max-width: 100%;
}
.code-block .code-lang {
    font-size: 10px;
    color: var(--muted-2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
    display: block;
}
.code-block code {
    font-family: inherit;
    font-size: inherit;
}

/* ─── TYPING ────────────────────────────────────────────────── */
.typing-dots { display: flex; gap: 4px; padding: 6px 2px; }
.typing-dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink {
    0%,80%,100% { opacity: .25; }
    40% { opacity: 1; }
}

/* ─── LINK PREVIEW ──────────────────────────────────────────── */
.link-preview {
    margin: 4px 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    max-width: 100%;
    background: rgba(255,255,255,0.03);
}
.link-preview a { text-decoration: none; color: inherit; display: flex; flex-direction: column; }
.link-preview-image {
    width: 100%;
    max-height: 140px;
    object-fit: cover;
    background: rgba(255,255,255,0.05);
}
.link-preview-body { padding: 10px 12px; }
.link-preview-title {
    font-weight: 600;
    font-size: 13px;
    color: var(--fg);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.link-preview-desc {
    font-size: 12px;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: 2px;
}
.link-preview-site {
    font-size: 10px;
    color: var(--muted-2);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 4px;
}

.embed-image {
    max-width: 100%;
    max-height: 280px;
    border-radius: 6px;
    margin: 4px 0;
    border: 1px solid var(--border);
}
.embed-video {
    max-width: 100%;
    max-height: 200px;
    border-radius: 6px;
    margin: 4px 0;
    border: 1px solid var(--border);
}
.embed-container {
    margin: 4px 0;
    padding: 10px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: inline-block;
    max-width: 100%;
}
.embed-container a { color: #8ab4f8; word-break: break-all; }
.embed-container a:hover { text-decoration: underline; }

/* ─── COMPOSER ───────────────────────────────────────────────── */
.composer-wrap {
    flex-shrink: 0;
    padding: 8px 12px 12px;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
}

.composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px 4px 4px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transition: border-color .2s, background .2s;
}
.composer:focus-within {
    border-color: rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.04);
}

.composer textarea {
    flex: 1;
    background: transparent;
    border: none;
    resize: none;
    color: var(--fg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    max-height: 100px;
    padding: 8px 0;
    width: 100%;
    min-height: 36px;
}
.composer textarea:focus { outline: none; }
.composer textarea::placeholder { color: var(--muted-2); }

.composer .send-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .12s, opacity .2s;
}
.composer .send-btn:hover { opacity: .85; }
.composer .send-btn:active { transform: scale(0.92); }
.composer .send-btn:disabled { opacity: .3; cursor: not-allowed; }

.footer-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--muted-2);
    text-align: center;
    padding-top: 6px;
}
.footer-text span { color: #4f4f4f; }

/* ─── SCROLLBAR ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--muted-2); border-radius: 99px; }

/* ─── RESPONSIVE ────────────────────────────────────────────── */
@media (max-width: 480px) {
    .brand-header { padding: 8px 12px; }
    .brand-mark { width: 24px; height: 24px; }
    .brand-text { font-size: 13px; }
    .brand-sub { font-size: 9px; }
    .btn-clear { font-size: 10px; padding: 4px 10px; }
    
    .chat-container { padding: 10px 10px 16px; gap: 10px; }
    .chat-msg { max-width: 94%; gap: 8px; }
    .chat-avatar { width: 24px; height: 24px; font-size: 9px; }
    .chat-bubble { font-size: 13px; padding: 8px 12px; }
    
    .composer-wrap { padding: 6px 10px 10px; }
    .composer { padding: 3px 3px 3px 12px; border-radius: 12px; }
    .composer textarea { font-size: 13px; min-height: 32px; padding: 6px 0; }
    .composer .send-btn { width: 34px; height: 34px; border-radius: 8px; }
    .composer .send-btn svg { width: 14px; height: 14px; }
    
    .empty-state h2 { font-size: 17px; }
    .empty-state p { font-size: 12px; }
    .code-block { font-size: 11px; padding: 8px 10px; }
    .link-preview-image { max-height: 100px; }
    .embed-image { max-height: 200px; }
    .embed-video { max-height: 160px; }
    .copy-btn { font-size: 10px; padding: 2px 8px; }
    
    .bg-logo-pattern::before { font-size: 40px; letter-spacing: 20px; }
}

@media (max-width: 380px) {
    .brand-text { font-size: 12px; }
    .btn-clear { font-size: 9px; padding: 3px 8px; }
    .chat-bubble { font-size: 12px; padding: 7px 10px; }
    .composer textarea { font-size: 12px; }
    .bg-logo-pattern::before { font-size: 30px; letter-spacing: 15px; }
}
</style>
</head>
<body>

<!-- BACKGROUND -->
<div class="bg-logo-pattern"></div>
<div class="grid-bg"></div>

<!-- HEADER -->
<header class="brand-header">
    <div class="brand-left">
        <span class="brand-mark">
            <img src="https://files.catbox.moe/2328ht.png" alt="Fz AI" onerror="this.parentElement.outerHTML='<span class=brand-mark-fallback>Fz</span>'">
        </span>
        <div>
            <div class="brand-text">Fz AI</div>
            <div class="brand-sub"><span class="dot-live"></span> online</div>
        </div>
    </div>
    <button class="btn-clear" id="clearBtn"><i class="fa-regular fa-trash-can"></i> Bersih</button>
</header>

<!-- CHAT AREA -->
<main class="chat-container" id="chatArea">
    <!-- EMPTY STATE -->
    <div class="empty-state" id="emptyState">
        <div>
            <div class="icon">⚡</div>
            <h2>Halo, saya Fz AI</h2>
            <p>Tanyakan apa saja — dari ide, kode, sampai obrolan santai.</p>
            <div class="powered">powered by Fiqqzr7</div>
        </div>
    </div>
</main>

<!-- COMPOSER -->
<div class="composer-wrap">
    <div class="composer">
        <textarea id="input" rows="1" placeholder="Tanya Fz AI..."></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Kirim">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4z"/></svg>
        </button>
    </div>
    <div class="footer-text">Fz AI boleh buat kesalahan · <span>⚡ Fiqqzr7</span></div>
</div>

<script>
// ============================================================
// FZ AI — MOBILE FOCUS
// ============================================================

const chatArea = document.getElementById('chatArea');
const emptyState = document.getElementById('emptyState');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');

let history = [];
let isProcessing = false;
const AVATAR_URL = 'https://files.catbox.moe/2328ht.png';

// ─── AUTO RESIZE ─────────────────────────────────────────────
function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
}
input.addEventListener('input', autoResize);

// ─── SEND ON ENTER ──────────────────────────────────────────
input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

// ─── PROCESS MESSAGE ────────────────────────────────────────
function processMessage(text) {
    let processed = text;
    
    // ─── CODE BLOCKS ──────────────────────────────────────────
    processed = processed.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
        const langLabel = lang ? `<span class="code-lang">${lang}</span>` : '';
        return `<div class="code-block">${langLabel}<code>${escapeHtml(code.trim())}</code></div>`;
    });
    
    // ─── INLINE CODE ──────────────────────────────────────────
    processed = processed.replace(/`([^`]+)`/g, (match, code) => {
        return `<code style="background:rgba(255,255,255,0.06);padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:0.9em;color:#e2e8f0;">${escapeHtml(code)}</code>`;
    });
    
    // ─── IMAGE LINKS ──────────────────────────────────────────
    const imageRegex = /(https?:\/\/[^\s]+\.(png|jpg|jpeg|gif|webp|bmp|svg))/gi;
    processed = processed.replace(imageRegex, (match) => {
        return `<div class="embed-container"><img src="${match}" alt="Image" class="embed-image" loading="lazy" onerror="this.style.display='none'"></div>`;
    });
    
    // ─── VIDEO LINKS ──────────────────────────────────────────
    const videoRegex = /(https?:\/\/[^\s]+\.(mp4|webm|mov|avi|mkv))/gi;
    processed = processed.replace(videoRegex, (match) => {
        return `<div class="embed-container"><video src="${match}" controls class="embed-video"></video></div>`;
    });
    
    // ─── YOUTUBE ──────────────────────────────────────────────
    const ytRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/gi;
    processed = processed.replace(ytRegex, (match, id) => {
        return `<div class="embed-container"><iframe src="https://www.youtube.com/embed/${id}" class="embed-video" style="aspect-ratio:16/9;width:100%;max-width:100%;border:none;border-radius:6px;" allowfullscreen></iframe></div>`;
    });
    
    // ─── REGULAR LINKS ────────────────────────────────────────
    const linkRegex = /(https?:\/\/[^\s]+)/gi;
    processed = processed.replace(linkRegex, (match) => {
        if (match.match(/\.(png|jpg|jpeg|gif|webp|bmp|svg|mp4|webm|mov|avi|mkv)/i)) return match;
        if (match.match(/youtube\.com|youtu\.be/)) return match;
        return `<div class="link-preview"><a href="${match}" target="_blank" rel="noopener"><div class="link-preview-body"><div class="link-preview-title">${match}</div><div class="link-preview-site">${new URL(match).hostname}</div></div></a></div>`;
    });
    
    return processed;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ─── COPY BUTTON ─────────────────────────────────────────────
function createCopyButton(text) {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin';
    btn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(text);
            btn.innerHTML = '<i class="fa-regular fa-check"></i> Disalin';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin';
                btn.classList.remove('copied');
            }, 2000);
        } catch {
            // Fallback
            const area = document.createElement('textarea');
            area.value = text;
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            area.remove();
            btn.innerHTML = '<i class="fa-regular fa-check"></i> Disalin';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin';
                btn.classList.remove('copied');
            }, 2000);
        }
    });
    return btn;
}

// ─── RENDER MESSAGE ──────────────────────────────────────────
function renderMessage(role, text, isError = false) {
    if (emptyState) emptyState.style.display = 'none';
    
    const msg = document.createElement('div');
    msg.className = `chat-msg ${role === 'user' ? 'user' : ''}`;
    
    // Avatar
    const avatar = document.createElement('div');
    avatar.className = `chat-avatar ${role === 'ai' ? 'ai' : 'user'}`;
    if (role === 'ai') {
        avatar.innerHTML = `<img src="${AVATAR_URL}" alt="Fz" onerror="this.style.display='none'; this.textContent='Fz';">`;
    } else {
        avatar.textContent = 'K';
    }
    
    // Bubble wrap
    const wrap = document.createElement('div');
    wrap.className = 'chat-bubble-wrap';
    
    // Bubble content
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${isError ? 'error' : ''}`;
    bubble.innerHTML = role === 'ai' ? processMessage(text) : text;
    
    // Copy button (for AI messages only)
    if (role === 'ai' && !isError) {
        const copyBtn = createCopyButton(text);
        wrap.appendChild(copyBtn);
    }
    
    wrap.appendChild(bubble);
    msg.appendChild(avatar);
    msg.appendChild(wrap);
    chatArea.appendChild(msg);
    
    // Scroll to bottom
    chatArea.scrollTop = chatArea.scrollHeight;
    return bubble;
}

// ─── TYPING ──────────────────────────────────────────────────
function renderTyping() {
    const msg = document.createElement('div');
    msg.className = 'chat-msg';
    msg.id = 'typingMsg';
    
    const avatar = document.createElement('div');
    avatar.className = 'chat-avatar ai';
    avatar.innerHTML = `<img src="${AVATAR_URL}" alt="Fz" onerror="this.style.display='none'; this.textContent='Fz';">`;
    
    const wrap = document.createElement('div');
    wrap.className = 'chat-bubble-wrap';
    
    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    
    wrap.appendChild(bubble);
    msg.appendChild(avatar);
    msg.appendChild(wrap);
    chatArea.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
    const el = document.getElementById('typingMsg');
    if (el) el.remove();
}

// ─── SEND MESSAGE ────────────────────────────────────────────
async function sendMessage() {
    const text = input.value.trim();
    if (!text || isProcessing) return;
    
    renderMessage('user', text);
    history.push({ role: 'user', content: text });
    
    input.value = '';
    autoResize();
    isProcessing = true;
    sendBtn.disabled = true;
    renderTyping();
    
    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: history })
        });
        const data = await res.json();
        removeTyping();
        
        if (!res.ok) {
            renderMessage('ai', 'Error: ' + (data.error || 'Terjadi kesalahan'), true);
        } else {
            renderMessage('ai', data.reply);
            history.push({ role: 'assistant', content: data.reply });
        }
    } catch (err) {
        removeTyping();
        renderMessage('ai', 'Gagal terhubung ke server.', true);
    } finally {
        isProcessing = false;
        sendBtn.disabled = false;
        input.focus();
    }
}

// ─── CLEAR ──────────────────────────────────────────────────
clearBtn.addEventListener('click', () => {
    history = [];
    chatArea.innerHTML = '';
    chatArea.appendChild(emptyState);
    emptyState.style.display = 'flex';
});

// ─── EVENTS ──────────────────────────────────────────────────
sendBtn.addEventListener('click', sendMessage);

// Focus input on load
input.focus();

console.log('Fz AI v2.0 — Powered by Fiqqzr7');
