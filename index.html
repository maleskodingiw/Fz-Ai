<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Fz AI — Assistant Pintar</title>
<link rel="icon" type="image/png" href="https://files.catbox.moe/2328ht.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg: #000;
    --fg: #ededed;
    --muted: #8f8f8f;
    --muted-2: #6f6f6f;
    --border: rgba(255,255,255,0.1);
    --border-hover: rgba(255,255,255,0.2);
    --accent: #fff;
    --accent-dim: rgba(255,255,255,0.2);
    --radius: 12px;
}

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
}

::selection { background: var(--accent-dim); color: #fff; }
.mono { font-family: 'JetBrains Mono', monospace; }

.bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -3;
    pointer-events: none;
}

.bg-video-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8,8,8,0.78);
    z-index: -2;
    pointer-events: none;
}

.ambient-glow {
    position: fixed;
    top: -150px;
    left: -100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(255,255,255,0.04) 0%, transparent 65%);
    pointer-events: none;
    z-index: -1;
}

.brand-header {
    flex-shrink: 0;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    z-index: 10;
}

.brand-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    overflow: hidden;
    border: 1px solid var(--border-hover);
    background: #111;
}
.brand-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.brand-mark-fallback {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    background: #111;
    border: 1px solid var(--border-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    color: #fff;
}

.brand-text {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -.01em;
}

.brand-sub {
    font-size: 10px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: .1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 5px;
}

.dot-live {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s ease-in-out infinite;
    display: inline-block;
}
@keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(.8); }
}

.btn-clear {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: border-color .2s, background .2s, color .2s;
}
.btn-clear:hover {
    border-color: var(--border-hover);
    background: rgba(255,255,255,0.08);
    color: var(--fg);
}

.hero-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px 10px;
    overflow: hidden;
}

.hero-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}

.hero-left {
    flex: 1;
    min-width: 0;
}

.hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px 4px 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 16px;
}
.hero-eyebrow-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
    display: inline-block;
}

.hero-h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(28px, 4.5vw, 48px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: 10px;
    color: #fff;
}
.hero-h1 .highlight {
    color: rgba(255,255,255,0.5);
}

.hero-p {
    font-size: 14px;
    color: var(--muted);
    max-width: 440px;
    line-height: 1.7;
    margin-bottom: 16px;
}

.hero-right {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.img3d-scene {
    position: relative;
    width: 100%;
    max-width: 320px;
    perspective: 800px;
}

.img3d-wrap {
    position: relative;
    border-radius: 18px;
    overflow: visible;
    transform-style: preserve-3d;
    transition: transform 0.08s ease-out;
    cursor: default;
    will-change: transform;
}

.img3d-img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    user-select: none;
}

.img3d-shine {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.02) 100%);
    pointer-events: none;
    mix-blend-mode: overlay;
}

.img3d-glow {
    position: absolute;
    inset: -3px;
    border-radius: 21px;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(100,100,255,0.05), transparent 60%);
    z-index: -1;
    opacity: 0;
    transition: opacity 0.5s ease;
    filter: blur(2px);
}
.img3d-wrap:hover .img3d-glow { opacity: 1; }

.img3d-shadow {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 40px;
    background: radial-gradient(ellipse, rgba(255,255,255,0.08) 0%, transparent 70%);
    filter: blur(16px);
    animation: shadowFloat 4s ease-in-out infinite;
}
@keyframes shadowFloat {
    0%,100% { opacity: 0.4; transform: translateX(-50%) scaleX(0.95); }
    50% { opacity: 0.7; transform: translateX(-50%) scaleX(1.05); }
}

.img3d-badge {
    position: absolute;
    padding: 5px 12px;
    background: rgba(10,10,10,0.9);
    border: 1px solid var(--border-hover);
    border-radius: 100px;
    font-size: 10px;
    font-weight: 600;
    color: var(--fg);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}

.badge-tl {
    top: -10px;
    left: -14px;
    animation: floatBadge1 3.5s ease-in-out infinite;
}
.badge-br {
    bottom: 12px;
    right: -14px;
    animation: floatBadge2 3.5s ease-in-out infinite 1.75s;
}

@keyframes floatBadge1 {
    0%,100% { transform: translateY(0px) rotate(-1deg); }
    50% { transform: translateY(-6px) rotate(0deg); }
}
@keyframes floatBadge2 {
    0%,100% { transform: translateY(0px) rotate(1deg); }
    50% { transform: translateY(-5px) rotate(0deg); }
}

.badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1.5s ease-in-out infinite;
    display: inline-block;
}

.chat-container {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 20px;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
}

.chat-container.active {
    display: flex;
}

.empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}
.empty-state .icon { font-size: 28px; margin-bottom: 10px; opacity: 0.4; }
.empty-state h2 { font-size: 18px; font-weight: 600; color: #fff; }
.empty-state p { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
.empty-state .powered { font-size: 10px; color: var(--muted-2); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }

.chat-msg {
    display: flex;
    gap: 10px;
    max-width: 92%;
    animation: rise 0.25s cubic-bezier(0.2,0.8,0.2,1);
}
@keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }

.chat-avatar {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    border: 1px solid var(--border-hover);
    overflow: hidden;
}
.chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
.chat-avatar.ai { background: var(--fg); color: #000; }
.chat-avatar.user { background: rgba(255,255,255,0.05); border-color: var(--border); color: var(--muted); }

.chat-bubble-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 100%;
}

.chat-bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
    max-width: 100%;
}
.chat-msg.ai .chat-bubble {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
}
.chat-msg.user .chat-bubble {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-hover);
    border-top-right-radius: 4px;
}
.chat-bubble.error {
    border-color: rgba(255,255,255,0.25) !important;
    background: rgba(255,255,255,0.05) !important;
    color: #f2a3a3;
}

.copy-code-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--muted-2);
    font-size: 10px;
    padding: 2px 10px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.2s;
    margin-top: 4px;
    align-self: flex-start;
}
.copy-code-btn:hover {
    border-color: var(--border-hover);
    background: rgba(255,255,255,0.1);
    color: var(--fg);
}
.copy-code-btn.copied {
    color: #4ade80;
    border-color: #4ade80;
}

.code-block {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 6px 0;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: #e2e8f0;
    max-width: 100%;
}
.code-block .code-lang { font-size: 10px; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; display: block; }
.code-block code { font-family: inherit; font-size: inherit; }
.code-actions { display: flex; justify-content: flex-end; margin-top: 4px; }

.typing-dots { display: flex; gap: 4px; padding: 6px 2px; }
.typing-dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink {
    0%,80%,100% { opacity: .25; }
    40% { opacity: 1; }
}

.link-preview {
    margin: 4px 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    max-width: 100%;
    background: rgba(255,255,255,0.03);
}
.link-preview a { text-decoration: none; color: inherit; display: flex; flex-direction: column; }
.link-preview-image { width: 100%; max-height: 120px; object-fit: cover; background: rgba(255,255,255,0.05); }
.link-preview-body { padding: 10px 12px; }
.link-preview-title { font-weight: 600; font-size: 13px; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.link-preview-desc { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.link-preview-site { font-size: 10px; color: var(--muted-2); font-family: 'JetBrains Mono', monospace; margin-top: 4px; }

.embed-image { max-width: 100%; max-height: 240px; border-radius: 6px; margin: 4px 0; border: 1px solid var(--border); }
.embed-video { max-width: 100%; max-height: 180px; border-radius: 6px; margin: 4px 0; border: 1px solid var(--border); }
.embed-container { margin: 4px 0; padding: 10px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; display: inline-block; max-width: 100%; }
.embed-container a { color: #8ab4f8; word-break: break-all; }
.embed-container a:hover { text-decoration: underline; }

.inline-code {
    background: rgba(255,255,255,0.06);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9em;
    color: #e2e8f0;
}

.composer-wrap {
    flex-shrink: 0;
    padding: 8px 12px 12px;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
}

.composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px 4px 4px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transition: border-color .2s, background .2s;
}
.composer:focus-within {
    border-color: rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.04);
}

.composer textarea {
    flex: 1;
    background: transparent;
    border: none;
    resize: none;
    color: var(--fg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    max-height: 100px;
    padding: 8px 0;
    width: 100%;
    min-height: 36px;
}
.composer textarea:focus { outline: none; }
.composer textarea::placeholder { color: var(--muted-2); }

.composer .send-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .12s, opacity .2s;
}
.composer .send-btn:hover { opacity: .85; }
.composer .send-btn:active { transform: scale(0.92); }
.composer .send-btn:disabled { opacity: .3; cursor: not-allowed; }

.footer-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--muted-2);
    text-align: center;
    padding-top: 6px;
}
.footer-text span { color: #4f4f4f; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--muted-2); border-radius: 99px; }

@media (max-width: 640px) {
    .hero-inner { flex-direction: column-reverse; gap: 20px; }
    .hero-left { text-align: center; }
    .hero-p { max-width: 100%; }
    .hero-right { max-width: 200px; }
    .img3d-scene { max-width: 200px; }
    .badge-tl { top: -8px; left: -8px; padding: 3px 10px; font-size: 9px; }
    .badge-br { bottom: 8px; right: -8px; padding: 3px 10px; font-size: 9px; }
    .hero-h1 { font-size: clamp(24px, 6vw, 32px); }
    .brand-header { padding: 8px 12px; }
    .brand-mark { width: 24px; height: 24px; }
    .brand-text { font-size: 13px; }
    .brand-sub { font-size: 9px; }
    .btn-clear { font-size: 10px; padding: 4px 10px; }
    .img3d-shadow { bottom: -30px; height: 30px; }
}

@media (max-width: 380px) {
    .hero-right { max-width: 150px; }
    .img3d-scene { max-width: 150px; }
    .badge-tl, .badge-br { display: none; }
    .hero-h1 { font-size: 20px; }
    .hero-p { font-size: 12px; }
    .composer textarea { font-size: 12px; }
}
</style>
</head>
<body>

<video class="bg-video" autoplay muted loop playsinline>
    <source src="https://files.catbox.moe/8zujc8.mp4" type="video/mp4">
</video>
<div class="bg-video-overlay"></div>
<div class="ambient-glow"></div>

<header class="brand-header">
    <div class="brand-left">
        <span class="brand-mark" id="navLogo">
            <img src="https://files.catbox.moe/2328ht.png" alt="Fz AI" onerror="this.parentElement.outerHTML='<span class=brand-mark-fallback>Fz</span>'">
        </span>
        <div>
            <div class="brand-text">Fz AI</div>
            <div class="brand-sub"><span class="dot-live"></span> online</div>
        </div>
    </div>
    <button class="btn-clear" id="clearBtn"><i class="fa-regular fa-trash-can"></i> Clear</button>
</header>

<section class="hero-area" id="heroArea">
    <div class="hero-inner">
        <!-- LEFT -->
        <div class="hero-left">
            <div class="hero-eyebrow">
                <span class="hero-eyebrow-dot"></span>
                FZ AI v2.0
            </div>
            <h1 class="hero-h1">
                Halo, saya<br><span class="highlight">Fz AI</span>
            </h1>
            <p class="hero-p">Tanyakan apa saja Terima Kasih Sudah Menggunak Fz AI.</p>
            <button class="btn-clear" style="display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#000;border:none;padding:10px 20px;font-weight:600;border-radius:10px;font-size:13px;cursor:pointer;transition:opacity 0.2s;" onclick="startChat()">
                <i class="fa-regular fa-comment"></i> Mula Chat
            </button>
        </div>
        <div class="hero-right">
            <div class="img3d-scene">
                <div class="img3d-wrap" id="img3d">
                    <div class="img3d-glow"></div>
                    <img src="https://files.catbox.moe/2328ht.png" alt="Fz AI" class="img3d-img" draggable="false">
                    <div class="img3d-shine"></div>
                    <div class="img3d-badge badge-tl">
                        <span class="badge-dot"></span> Online
                    </div>
                    <div class="img3d-badge badge-br">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="var(--accent)"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                        AI Active
                    </div>
                </div>
                <div class="img3d-shadow"></div>
            </div>
        </div>
    </div>
</section>

<main class="chat-container" id="chatArea">
    <div class="empty-state" id="emptyState">
        <div>
            <div class="icon">Fz</div>
            <h2>Halo, saya Fz AI</h2>
            <p>Tanyakan apa saja — Terima Kasih Sudah Mengunakkan Fz AI.</p>
            <div class="powered">powered by Fiqqzr7</div>
        </div>
    </div>
</main>

<div class="composer-wrap">
    <div class="composer">
        <textarea id="input" rows="1" placeholder="Tanya Fz AI..."></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Kirim">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4z"/></svg>
        </button>
    </div>
    <div class="footer-text">Fz AI boleh buat kesalahan · <span>powered by Fiqqzr7</span></div>
</div>

<script>

function startChat() {
    document.getElementById('heroArea').style.display = 'none';
    document.getElementById('chatArea').classList.add('active');
    document.getElementById('input').focus();
}

const img3d = document.getElementById('img3d');
const img3dScene = img3d?.closest('.img3d-scene');
if (img3dScene && img3d) {
    let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0;
    img3dScene.addEventListener('mousemove', (e) => {
        const rect = img3dScene.getBoundingClientRect();
        const dx = (e.clientX - rect.left - rect.width/2) / (rect.width/2);
        const dy = (e.clientY - rect.top - rect.height/2) / (rect.height/2);
        targetRX = dy * -12;
        targetRY = dx * 12;
    });
    img3dScene.addEventListener('mouseleave', () => { targetRX = 0; targetRY = 0; });
    (function loop() {
        curRX += (targetRX - curRX) * 0.07;
        curRY += (targetRY - curRY) * 0.07;
        const scale = Math.abs(curRX) > 0.1 || Math.abs(curRY) > 0.1 ? 1.02 : 1;
        img3d.style.transform = 'rotateX(' + curRX + 'deg) rotateY(' + curRY + 'deg) scale(' + scale + ')';
        requestAnimationFrame(loop);
    })();
}

const chatArea = document.getElementById('chatArea');
const emptyState = document.getElementById('emptyState');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');

let history = [];
let isProcessing = false;
const AVATAR_URL = 'https://files.catbox.moe/2328ht.png';

function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
}
input.addEventListener('input', autoResize);

input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function processMessage(text) {
    let processed = text;
    let codeBlocks = [];
    
    processed = processed.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
        const langLabel = lang ? '<span class="code-lang">' + escapeHtml(lang) + '</span>' : '';
        const cleanCode = code.trim();
        codeBlocks.push(cleanCode);
        return '<div class="code-block">' + langLabel + '<code>' + escapeHtml(cleanCode) + '</code><div class="code-actions"></div></div>';
    });
    
    processed = processed.replace(/`([^`]+)`/g, function(match, code) {
        return '<span class="inline-code">' + escapeHtml(code) + '</span>';
    });
    
    const imageRegex = /(https?:\/\/[^\s]+\.(png|jpg|jpeg|gif|webp|bmp|svg))/gi;
    processed = processed.replace(imageRegex, function(match) {
        return '<div class="embed-container"><img src="' + match + '" alt="Image" class="embed-image" loading="lazy" onerror="this.style.display=\'none\'"></div>';
    });
    
    const videoRegex = /(https?:\/\/[^\s]+\.(mp4|webm|mov|avi|mkv))/gi;
    processed = processed.replace(videoRegex, function(match) {
        return '<div class="embed-container"><video src="' + match + '" controls class="embed-video"></video></div>';
    });
    
    const ytRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/gi;
    processed = processed.replace(ytRegex, function(match, id) {
        return '<div class="embed-container"><iframe src="https://www.youtube.com/embed/' + id + '" class="embed-video" style="aspect-ratio:16/9;width:100%;max-width:100%;border:none;border-radius:6px;" allowfullscreen></iframe></div>';
    });
    
    const linkRegex = /(https?:\/\/[^\s]+)/gi;
    processed = processed.replace(linkRegex, function(match) {
        if (match.match(/\.(png|jpg|jpeg|gif|webp|bmp|svg|mp4|webm|mov|avi|mkv)/i)) return match;
        if (match.match(/youtube\.com|youtu\.be/)) return match;
        try { var hostname = new URL(match).hostname; } catch { var hostname = match; }
        return '<div class="link-preview"><a href="' + match + '" target="_blank" rel="noopener"><div class="link-preview-body"><div class="link-preview-title">' + match + '</div><div class="link-preview-site">' + hostname + '</div></div></a></div>';
    });
    
    window._codeBlocks = codeBlocks;
    return processed;
}

function addCopyButtonsToCodeBlocks() {
    var codeBlocks = document.querySelectorAll('.code-block');
    codeBlocks.forEach(function(block) {
        var actions = block.querySelector('.code-actions');
        if (actions && !actions.querySelector('.copy-code-btn')) {
            var codeText = block.querySelector('code');
            if (codeText) {
                var text = codeText.textContent;
                var btn = document.createElement('button');
                btn.className = 'copy-code-btn';
                btn.textContent = 'Copy code';
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    copyCode(text, btn);
                });
                actions.appendChild(btn);
            }
        }
    });
}

function copyCode(text, btn) {
    try {
        navigator.clipboard.writeText(text).then(function() {
            btn.textContent = 'Copied';
            btn.classList.add('copied');
            setTimeout(function() {
                btn.textContent = 'Copy code';
                btn.classList.remove('copied');
            }, 2000);
        }).catch(function() { fallbackCopy(text, btn); });
    } catch { fallbackCopy(text, btn); }
}

function fallbackCopy(text, btn) {
    var area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    try {
        document.execCommand('copy');
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(function() {
            btn.textContent = 'Copy code';
            btn.classList.remove('copied');
        }, 2000);
    } catch { btn.textContent = 'Failed'; }
    area.remove();
}

function renderMessage(role, text, isError) {
    if (isError === undefined) isError = false;
    if (emptyState) emptyState.style.display = 'none';
    
    var msg = document.createElement('div');
    msg.className = 'chat-msg' + (role === 'user' ? ' user' : '');
    
    var avatar = document.createElement('div');
    avatar.className = 'chat-avatar ' + (role === 'ai' ? 'ai' : 'user');
    if (role === 'ai') {
        avatar.innerHTML = '<img src="' + AVATAR_URL + '" alt="Fz" onerror="this.style.display=\'none\'; this.textContent=\'Fz\';">';
    } else {
        avatar.textContent = 'K';
    }
    
    var wrap = document.createElement('div');
    wrap.className = 'chat-bubble-wrap';
    
    var bubble = document.createElement('div');
    bubble.className = 'chat-bubble' + (isError ? ' error' : '');
    if (role === 'ai' && !isError) {
        bubble.innerHTML = processMessage(text);
    } else {
        bubble.textContent = text;
    }
    
    wrap.appendChild(bubble);
    msg.appendChild(avatar);
    msg.appendChild(wrap);
    chatArea.appendChild(msg);
    if (role === 'ai' && !isError) { setTimeout(addCopyButtonsToCodeBlocks, 10); }
    chatArea.scrollTop = chatArea.scrollHeight;
    return bubble;
}

function renderTyping() {
    var msg = document.createElement('div');
    msg.className = 'chat-msg';
    msg.id = 'typingMsg';
    var avatar = document.createElement('div');
    avatar.className = 'chat-avatar ai';
    avatar.innerHTML = '<img src="' + AVATAR_URL + '" alt="Fz" onerror="this.style.display=\'none\'; this.textContent=\'Fz\';">';
    var wrap = document.createElement('div');
    wrap.className = 'chat-bubble-wrap';
    var bubble = document.createElement('div');
    bubble.className = 'chat-bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    wrap.appendChild(bubble);
    msg.appendChild(avatar);
    msg.appendChild(wrap);
    chatArea.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
    var el = document.getElementById('typingMsg');
    if (el) el.remove();
}

async function sendMessage() {
    var text = input.value.trim();
    if (!text || isProcessing) return;
    
    renderMessage('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    autoResize();
    isProcessing = true;
    sendBtn.disabled = true;
    renderTyping();
    
    try {
        var res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: history })
        });
        var data = await res.json();
        removeTyping();
        if (!res.ok) {
            renderMessage('ai', 'Error: ' + (data.error || 'Terjadi kesalahan'), true);
        } else {
            renderMessage('ai', data.reply);
            history.push({ role: 'assistant', content: data.reply });
        }
    } catch (err) {
        removeTyping();
        renderMessage('ai', 'Gagal terhubung ke server.', true);
    } finally {
        isProcessing = false;
        sendBtn.disabled = false;
        input.focus();
    }
}

sendBtn.addEventListener('click', sendMessage);

clearBtn.addEventListener('click', function() {
    history = [];
    chatArea.innerHTML = '';
    chatArea.appendChild(emptyState);
    emptyState.style.display = 'flex';
});

input.focus();
console.log('Fz AI v2.0 — Powered by Fiqqzr7');
</script>

</body>
</html>
